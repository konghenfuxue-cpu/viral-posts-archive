<!doctype html>
<html lang="zh-CN" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="浏览贴吧故事合集、原帖来源、含图 PDF 和网盘下载入口。">
<title>贴吧故事帖档案馆</title>
<link rel="icon" href="/favicon.png" type="image/png" sizes="96x96">
<link rel="stylesheet" href="book/css/variables-8adf115d.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
a { color: var(--links); }
a:focus-visible { outline: 2px solid var(--links); outline-offset: 3px; }
.btn { background: var(--theme-popup-bg); color: var(--fg); border: 1px solid var(--sidebar-spacer); border-radius: 6px; padding: 8px 18px; text-decoration: none; font-weight: 600; }
.btn-primary { background: var(--fg); color: var(--bg); }
.btn:hover { background: var(--theme-hover); color: var(--fg); }
body { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
.site-width { width: min(100% - 48px, 72rem); margin-inline: auto; }
.site-header, .site-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding-block: 12px; }
.site-header a, .site-footer a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
.site-header a:hover, .site-footer a:hover { text-decoration: underline; }
.site-header nav { display: flex; flex-wrap: wrap; gap: 16px; }
.site-main { display: grid; align-items: center; padding-block: 24px; }
.site-hero { padding: clamp(24px, 6vw, 76px); background: var(--sidebar-bg); border: 1px solid var(--sidebar-spacer); border-radius: 10px; }
.site-hero h1 { margin: 0 0 12px; font-size: clamp(1.75rem, 4vw, 3.4rem); line-height: 1.2; text-wrap: balance; }
.site-hero p { font-size: clamp(1rem, 1.5vw, 1.2rem); line-height: 1.65; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.actions .btn { display: inline-flex; min-height: 48px; justify-content: center; align-items: center; gap: 8px; }
@media (max-width: 600px) {
  body { display: block; }
  .site-width { width: calc(100% - 32px); }
  .site-header, .site-footer { padding-block: 4px; }
  .site-main { padding-block: 12px 16px; }
  .site-hero { padding: 24px 20px; }
  .actions { display: grid; grid-template-columns: minmax(0, 1fr); }
}
</style>
<script>
const fallbackTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'navy' : 'light';
let theme = fallbackTheme;
try { theme = localStorage.getItem('mdbook-theme')?.replaceAll('"', '') || fallbackTheme; } catch {}
document.documentElement.className = ['light', 'rust', 'coal', 'navy', 'ayu'].includes(theme) ? theme : fallbackTheme;
</script>
</head>
<body>

<main class="site-width site-main">
<section class="site-hero">
<h1>贴吧故事帖档案馆</h1>
<p>那些年我们一起看过的贴吧故事</p>
<div class="actions"><a class="btn btn-primary" href="book/index.html">在线看 <span aria-hidden="true">→</span></a><a class="btn" href="book/download.html">网盘下载 <span aria-hidden="true">→</span></a></div>
</section>
</main>
<footer><div class="site-width site-footer"><span>黑背雪整理</span><a href="https://github.com/konghenfuxue-cpu/viral-posts-archive/issues">补档与纠错</a></div></footer>
</body>
</html>
